[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-ml"
version = "0.1.0"
description = "Generador de dataset sintetico para el experimento academico de riesgo operacional (Fase 15A)"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pydantic==2.9.2",
    "tzdata==2024.2",
    # Fase 15B: entrenamiento y evaluacion. Version verificada en el entorno,
    # no supuesta. scipy y joblib son dependencias transitivas de sklearn y se
    # fijan para que el experimento sea reproducible.
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "joblib==1.6.0",
    # Fase 15C: servicio HTTP experimental. Solo el minimo para servir el
    # modelo; el consumidor sera Laravel en la Fase 16, no un navegador.
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    # TestClient de FastAPI se apoya en httpx.
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # `starlette.testclient` usa el alias antiguo `anyio.abc.BlockingPortal` al
    # importarse. Es codigo de terceros y no hay forma de evitarlo desde aqui,
    # asi que se silencia ese aviso concreto y solo ese: el resto sigue siendo
    # error.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["recruitment_ml"]
branch = true
