[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-ml"
version = "0.1.0"
description = "Generador de dataset sintetico para el experimento academico de riesgo operacional (Fase 15A)"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pydantic==2.9.2",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["recruitment_ml"]
branch = true
