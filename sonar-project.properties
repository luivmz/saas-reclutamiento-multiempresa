sonar.projectKey=reclutamiento-sonarqube
sonar.projectName=SaaS Reclutamiento Multiempresa
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Authored application code, including the experimental Python service.
sonar.sources=app,routes,resources,database,config,bootstrap,public,ml-service
sonar.tests=tests,cypress,resources/js,ml-service/tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,public/storage/**,resources/js/actions/**,resources/js/routes/**,resources/js/wayfinder/**,ml-service/.venv/**,ml-service/artifacts/**,**/__pycache__/**,**/*.test.ts,**/*.test.tsx,ml-service/tests/**
sonar.test.inclusions=tests/**,cypress/**,**/*.test.ts,**/*.test.tsx,ml-service/tests/**

# PHPUnit must generate these before scanning. PHP coverage is not JS/Python coverage.
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results.xml
sonar.php.version=8.4
