sonar.projectKey=saas-reclutamiento-multiempresa
sonar.projectName=SaaS Reclutamiento Multiempresa
sonar.projectVersion=1.1
sonar.sourceEncoding=UTF-8

# Production roots preserved; co-located TypeScript tests are classified separately.
sonar.sources=app,resources/js,routes
sonar.tests=tests,resources/js
# Test inclusions also prevent these test files from being indexed as main sources.
sonar.test.inclusions=tests/**,resources/js/**/*.test.tsx
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,docs/**,database/**,cypress/**,ml-service/**

sonar.php.coverage.reportPaths=coverage.xml
