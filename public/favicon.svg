<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>SaaS Reclutamiento</title>
  <!-- Marca de la plataforma (resources/js/components/app-logo-icon.tsx) sobre una baldosa del color primario.
       En navegadores con tema oscuro la baldosa usa el primario claro para no hundirse en la barra de pestañas. -->
  <style>
    .baldosa { fill: #07616f; }
    .marca { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .baldosa { fill: #63b8bd; }
      .marca { fill: #0d161a; }
    }
  </style>
  <rect class="baldosa" width="32" height="32" rx="7"/>
  <g class="marca" transform="translate(4 4)"><rect x="2" y="4" width="15" height="3" rx="1.5"/><rect x="2" y="10" width="10" height="3" rx="1.5"/><rect x="2" y="16" width="13" height="3" rx="1.5"/><circle cx="20" cy="11.5" r="2.5"/></g>
</svg>
