   <text x="122" y="653" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Riesgo operacional depende solo de Modelos </text>
   <text x="122" y="663" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">(lectura). Ningún paquete de negocio depende de </text>
