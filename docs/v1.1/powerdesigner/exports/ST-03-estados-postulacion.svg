   <text x="1322" y="710" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Solo por RF-24; como mucho una por vacante (índice parcial).</text>
   <text x="1322" y="720" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">La decisión RF-23 no es una transición: la elegida sigue en finalista</text>
