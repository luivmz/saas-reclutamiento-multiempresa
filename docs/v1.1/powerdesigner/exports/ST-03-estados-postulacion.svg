   <text x="148" y="345" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Tras la decisión final no hay cambios manuales (A-28).</text>
   <text x="148" y="355" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Con la vacante cerrada, ningún cambio.</text>
   <text x="148" y="365" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle">Cambios manuales notifican (RF-15); automáticos y RF-24 no;</text>
   <text x="148" y="375" fill="#000000" font-size="10" font-family="'Arial Unicode MS','Arial'" text-anchor="middle"> el cierre notifica por RF-26.</text>
